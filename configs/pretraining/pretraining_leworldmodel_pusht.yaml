mode: pretraining
method: leworldmodel

data:
  datasets_folder_path: /home/lmk22/wm-datasets
  dataset: pusht
  batch_size: 128
  image_size: 224
  num_workers: 8
  prefetch_factor: 1
  persistent_workers: false
  pin_memory: false
  drop_last: true
  normalize:
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]

meta:
  seed: 2026
  model_name: vit_tiny
  patch_size: 14
  embed_dim: 192
  action_block: 5
  context_length: 3
  predictor:
    depth: 6
    num_heads: 16
    dim_head: 64
    mlp_dim: 2048
    dropout: 0.1
    emb_dropout: 0.0
  projector:
    hidden_dim: 2048
    norm: batch_norm
  save_every: 1

optimization:
  num_epochs: 10
  optimizer: adamw
  weight_decay:
    values: [0.001]
    type: constant
    interval: epoch
    decay_bias: true
    decay_norm: true
  lr:
    values: [0, 0.00005, 0]
    type: warmup_cosine
    interval: step
    warmup_fraction: 0.01
  precision: bfloat16
  gradient_clip_norm: 1.0
  criterion: mse
  sigreg:
    weight: 0.1
    knots: 17
    num_proj: 1024

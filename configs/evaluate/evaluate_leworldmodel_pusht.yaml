mode: evaluate
method: leworldmodel

data:
  datasets_folder_path: /home/lmk22/wm-datasets
  dataset: pusht

meta:
  seed: 2026 # Local reproducibility choice; not specified by the paper.

planning:
  horizon: 5 # Model steps; 25 environment steps with action_block 5.
  replanning_horizon: 5
  cem_solver:
    use: true
    batch_size: 1
    num_samples: 300
    num_iterations: 30 # Appendix D: 30 for PushT, 10 for other environments.
    num_elites: 30
    var_scale: 1.0
  gradient_solver:
    # Optional upstream solver, disabled because paper evaluation uses CEM.
    # https://github.com/lucas-maes/le-wm/blob/8edfeb336732b5f3ce7b8b210d0ba370a09e2cac/config/eval/solver/adam.yaml
    use: false
    batch_size: 1
    num_samples: 100
    num_iterations: 30
    var_scale: 1.0
    action_noise: 0.0
    optimizer:
      type: adamw
      lr: 0.1

evaluation:
  num_episodes: 50
  goal_offset_steps: 25
  max_steps: 50
  save_video: true

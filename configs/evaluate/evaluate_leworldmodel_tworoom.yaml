mode: evaluate
method: leworldmodel

meta:
  seed: 2026

planning:
  env_name: swm/TwoRoom-v1
  horizon: 5
  replanning_horizon: 5
  cem_solver:
    use: true
    batch_size: 1
    num_samples: 300
    num_iterations: 10
    num_elites: 30
    var_scale: 1.0
  gradient_solver:
    use: true
    batch_size: 1
    num_samples: 100
    num_iterations: 30
    var_scale: 1.0
    action_noise: 0.0
    optimizer:
      type: adamw
      lr: 0.1

evaluation:
  num_episodes: 50
  goal_offset_steps: 25
  max_steps: 50
  save_video: true
